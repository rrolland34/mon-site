<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Automatismes 3e - Mon Site de Maths
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>
  <style>
    .troisieme-page .troisieme-layout {
      width: calc(100% - 32px);
      max-width: 1200px;
      margin: 28px auto;
    }
    .troisieme-page .troisieme-domain {
      display: block;
      width: 100%;
      max-width: none;
      margin: 0 0 24px;
      padding: clamp(16px, 2.5vw, 28px);
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
    .troisieme-page .domain-header {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(1.35rem, 2.2vw, 1.8rem);
      line-height: 1.3;
      margin: 0 0 22px;
    }
    .troisieme-page .domain-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(109, 213, 250, 0.14);
      color: #6dd5fa;
    }
    .troisieme-page .series-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      width: 100%;
    }
    .troisieme-page .series-grid .category-btn {
      width: 100%;
      min-width: 0;
      min-height: 76px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }
    @media (min-width: 500px) {
      .troisieme-page .series-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 800px) {
      .troisieme-page .series-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1200px) {
      .troisieme-page .series-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 1199px) {
      .troisieme-page .nav-list { flex-wrap: wrap; gap: 12px; }
    }
  </style>
</head>

<body class="troisieme-page">
  <!-- Barre de navigation -->
  <nav class="navbar">
    <ul class="nav-list">
      <li class="nav-item">
        <a
          href="index.html"
          class="nav-link"
        >
          Accueil
        </a>
      </li>

      <li class="nav-item">
        <a
          href="automatismes_6.html"
          class="nav-link"
        >
          Automatismes 6e
        </a>
      </li>

      <li class="nav-item">
        <a
          href="automatismes_3.html"
          class="nav-link active"
        >
          Automatismes 3e
        </a>
      </li>

      <li class="nav-item">
        <a
          href="automatismes_dnb.html"
          class="nav-link"
        >
          Automatismes DNB
        </a>
      </li>

      <li class="nav-item">
        <a
          href="exercise_selection.html"
          class="nav-link"
        >
          Exercices
        </a>
      </li>

      <li class="nav-item">
        <a
          href="outils.html"
          class="nav-link"
        >
          Outils
        </a>
      </li>

      <li class="nav-item">
        <a
          href="videos.html"
          class="nav-link"
        >
          Vidéos
        </a>
      </li>
    </ul>
  </nav>

  <!-- Contenu principal -->
  <main class="container troisieme-layout">
    <section class="buttons-section troisieme-domain" aria-labelledby="troisieme-domain-1">
      <h2 id="troisieme-domain-1" class="domain-header"><span class="domain-number">1</span><span>Nombres et calculs</span></h2>
      <div class="button-row series-grid">
        <button
          type="button"
          class="category-btn"
          onclick="window.location.href='questions_flash.html?table=puissances_niveau_1'"
          data-exercise="puissances_niveau_1"
        ></button>

        <button
          type="button"
          class="category-btn"
          onclick="window.location.href='questions_flash.html?table=puissances_niveau_2'"
          data-exercise="puissances_niveau_2"
        ></button>

        <button
          type="button"
          class="category-btn"
          onclick="window.location.href='questions_flash.html?table=ecriture_scientifique'"
          data-exercise="ecriture_scientifique"
        ></button>
      </div>
    </section>

    <section class="buttons-section troisieme-domain" aria-labelledby="troisieme-domain-2">
      <h2 id="troisieme-domain-2" class="domain-header"><span class="domain-number">2</span><span>Espace et géométrie</span></h2>
      <div class="button-row series-grid">
        <button
          type="button"
          class="category-btn"
          onclick="window.location.href='questions_flash.html?table=reperage_repere_orthonorme'"
          data-exercise="reperage_repere_orthonorme"
        ></button>
      </div>
    </section>

    <section class="buttons-section troisieme-domain" aria-labelledby="troisieme-domain-3">
      <h2 id="troisieme-domain-3" class="domain-header"><span class="domain-number">3</span><span>Organisation et gestion de données et probabilités</span></h2>
      <div class="button-row series-grid">
        <button type="button" class="category-btn"
          onclick="window.location.href='questions_flash.html?table=statistiques'"
          data-exercise="statistiques"></button>
      </div>
    </section>

    <section class="buttons-section troisieme-domain" aria-labelledby="troisieme-domain-4">
      <h2 id="troisieme-domain-4" class="domain-header"><span class="domain-number">4</span><span>Proportionnalité, fonctions</span></h2>
      <div class="button-row series-grid">
        <button
          type="button"
          class="category-btn"
          onclick="window.location.href='questions_flash.html?table=vitesse_moyenne'"
          data-exercise="vitesse_moyenne"
        ></button>

        <button
          type="button"
          class="category-btn"
          onclick="window.location.href='questions_flash.html?table=proportionnalite'"
          data-exercise="proportionnalite"
        ></button>
      </div>
    </section>

    <section class="buttons-section troisieme-domain" aria-labelledby="troisieme-domain-5">
      <h2 id="troisieme-domain-5" class="domain-header"><span class="domain-number">5</span><span>La pensée informatique</span></h2>
      <div class="button-row series-grid">
        <button type="button" class="category-btn"
          onclick="window.location.href='questions_flash.html?table=scratch_reconnaitre_figures'"
          data-exercise="scratch_reconnaitre_figures"></button>
      </div>
    </section>
  </main>

  <script
    type="module"
    src="./core/exerciseButtons.js"
  ></script>
</body>
</html>
