    name="viewport"

  >

  <title>
    Automatismes 6e - Mon Site de Maths
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <script
    id="MathJax-script"
    async
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>
  <style>
    .sixieme-page .sixieme-layout {
      width: calc(100% - 32px);
      max-width: 1200px;
      margin: 28px auto;
    }
    .sixieme-page .sixieme-domain {
      display: block;
      width: 100%;
      max-width: none;
      margin: 0 0 24px;
      padding: clamp(16px, 2.5vw, 28px);
      background: rgba(255, 255, 255, 0.065);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
    }
    .sixieme-page .domain-header {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: clamp(1.35rem, 2.2vw, 1.8rem);
      line-height: 1.3;
      margin: 0 0 22px;
    }
    .sixieme-page .domain-number {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 42px;
      height: 42px;
      border-radius: 12px;
      background: rgba(109, 213, 250, 0.14);
      color: #6dd5fa;
    }
    .sixieme-page .series-grid {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 14px;
      width: 100%;
    }
    .sixieme-page .series-grid .category-btn {
      width: 100%;
      min-width: 0;
      min-height: 76px;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: normal;
      overflow-wrap: anywhere;
      line-height: 1.4;
    }
    @media (min-width: 500px) {
      .sixieme-page .series-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (min-width: 800px) {
      .sixieme-page .series-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    @media (min-width: 1200px) {
      .sixieme-page .series-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 1199px) {
      .sixieme-page .nav-list { flex-wrap: wrap; gap: 12px; }
    }
  </style>
</head>
