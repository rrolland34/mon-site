  <nav class="navbar">
    <ul class="nav-list">

      <li class="nav-item">
        <a

      <li class="nav-item">

      <li class="nav-item">

        >

        </a>
      </li>

    </ul>
  </nav>

  <main class="prime-page">

    <h1>
      Décomposition en facteurs premiers
    </h1>


    <div class="prime-mode">

      <button
        id="one-number-button"
        type="button"
        class="category-btn"
      >
        1 nombre
      </button>

      <button
        id="two-numbers-button"
        type="button"
        class="category-btn"
      >
        2 nombres
      </button>

    </div>


    <div class="prime-input-zone">

      <div
        id="first-number-zone"
        class="number-zone"
      >

        <label for="number-input">
          Nombre
        </label>

        <input
          id="number-input"
          type="number"
          min="2"
          step="1"
        >

      </div>


      <div
        id="second-number-zone"
        class="number-zone"
        style="display:none;"
      >

        <label for="second-number-input">
          Nombre 2
        </label>

        <input
          id="second-number-input"
          type="number"
          min="2"
          step="1"
        >

      </div>

    </div>


    <div
      id="input-message"
      class="input-message"
    ></div>


    <div class="prime-panel">

      <div
        id="factorizations-zone"
        class="factorizations-zone"
      >

        <div
          id="first-factorization"
          class="factorization-column"
          style="display:none;"
        >

          <div
            id="first-factorization-table"
            class="factorization-table"
          ></div>

          <div
            id="first-factorization-result"
            class="factorization-result"
          ></div>

        </div>


        <div
          id="second-factorization"
          class="factorization-column"
        >

          <div
            id="factorization-table"
            class="factorization-table"
          ></div>

          <div
            id="factorization-result"
            class="factorization-result"
          ></div>

        </div>

      </div>


      <div
        id="comparison-result"
        class="comparison-result"
      ></div>


      <div
        id="calculator-screen"
        class="calculator-screen"
      ></div>

    </div>

    <div class="prime-actions">

      <button
        id="next-step-button"
        type="button"
        class="category-btn"
      >
        Étape suivante
      </button>

      <button
        id="restart-button"
        type="button"
        class="category-btn"
      >
        Recommencer
      </button>

    </div>

  </main>


  <script
    type="module"
    src="facteurs_premiers.js"
  ></script>

</body>

</html>
