<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Exercices - Mon Site de Maths
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>
    .pythagoras-exercise .exercise-statement {
      font-size: clamp(1rem, 2.5vw, 1.8rem);
    }

    .pythagoras-exercise .proof-display {
      font-size: clamp(1rem, 2vw, 1.4rem);
    }

    .pythagoras-final-answer,
    .trigonometry-final-answer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .4em;
      max-width: 100%;
    }

    .pythagoras-final-answer #user-answer,
    .trigonometry-final-answer #user-answer { width: 8em; min-width: 0; }

    @media (max-width: 768px) {
      .pythagoras-exercise .main-content { padding: 8px; }
      .pythagoras-exercise .question-container { width: 100%; padding: 12px; }
      .pythagoras-exercise .nav-list { flex-wrap: wrap; gap: 8px; }
      .pythagoras-exercise .nav-link { padding: 6px 8px; }
      .pythagoras-exercise #presentation-control { margin-left: 0 !important; }
      .pythagoras-exercise .proof-choice { max-width: 100%; }
      .pythagoras-exercise .proof-choice-button,
      .pythagoras-exercise .proof-option { font-size: 1rem; padding: 8px; }
      .pythagoras-exercise .step-correction-layout { flex-direction: column; gap: 12px; }
      .pythagoras-exercise .step-correction-side {
        width: auto;
        max-width: 100%;
        text-align: center;
        /* Prévoir jusqu’à 9,8 em pour l’égalité dans la largeur intérieure
           de la carte (40 px de marges cumulées). */
        font-size: min(2.2em, calc((100vw - 40px) / 9.8));
      }
    }

    @media (max-width: 768px) {
      .pythagoras-converse-exercise .main-content { padding: 8px; }
      .pythagoras-converse-exercise .question-container { width: 100%; padding: 12px; }
      .pythagoras-converse-exercise .exercise-statement { font-size: clamp(1rem, 2.5vw, 1.8rem); }
      .pythagoras-converse-exercise .nav-list { flex-wrap: wrap; gap: 8px; }
      .pythagoras-converse-exercise .nav-link { padding: 6px 8px; }
      .pythagoras-converse-exercise #presentation-control { margin-left: 0 !important; }
      .pythagoras-converse-exercise #time-control { max-width: 100%; }
      .pythagoras-converse-exercise #time-control label { white-space: nowrap; }
      .pythagoras-converse-exercise #time-slider { min-width: 0; }
      .pythagoras-converse-exercise .proof-choice { max-width: 100%; }
      .pythagoras-converse-exercise .proof-choice-input {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 7rem);
        gap: 8px;
        max-width: 100%;
      }
      .pythagoras-converse-exercise .proof-choice-input-label {
        grid-column: 1 / -1;
        width: auto;
      }
      .pythagoras-converse-exercise .proof-choice-input .proof-choice,
      .pythagoras-converse-exercise .proof-choice-input .proof-input-field {
        width: 100%;
        min-width: 0;
      }
    }

    .thales-proof-exercise .exercise-statement { font-size: clamp(1rem, 2.5vw, 1.8rem); }
    .thales-proof-exercise .nav-list { flex-wrap: wrap; }
    .thales-math-statement { line-height: 1.4; }
    .thales-math-statement mjx-container { max-width: 100%; margin: 0; }
    .thales-proof-exercise .main-content,
    .thales-proof-exercise .question-container { min-width: 0; box-sizing: border-box; }
    .thales-proof-exercise .proof-display { max-width: 100%; }
    .thales-proof-exercise .proof-ratio-row,
    .thales-proof-exercise .proof-cross-product-row { flex-wrap: wrap; gap: 16px 32px; }
    .thales-proof-exercise .proof-ratio-input,
    .thales-proof-exercise .proof-cross-product-input { flex-wrap: wrap; max-width: 100%; white-space: normal; }
    .thales-proof-exercise .proof-ratio-input .proof-choice { width: 7.5em; }
    .thales-proof-exercise .proof-choice-button,
    .thales-proof-exercise .proof-option { box-sizing: border-box; white-space: normal; }
    .thales-proof-exercise .proof-box { max-width: 100%; box-sizing: border-box; }
    .thales-proof-exercise .proof-input-field { max-width: 100%; box-sizing: border-box; }
    .thales-parallelism-data { margin: .35em 0; }
    .thales-final-answer { display: inline-flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: .4em; max-width: 100%; }
    .thales-final-answer #user-answer { width: 8em; max-width: 100%; box-sizing: border-box; }
    .thales-converse-theorem-exercise .proof-input { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    @media (max-width: 600px) {
      .thales-proof-exercise .question-container { width: 100%; padding: 12px; }
      .thales-proof-exercise .main-content { padding: 8px; }
      .thales-proof-exercise .nav-list { gap: 8px; }
      .thales-proof-exercise .nav-link { padding: 6px 8px; }
      .thales-proof-exercise .proof-choice { max-width: 100%; }
      .thales-proof-exercise #time-control { max-width: calc(100% - 16px); }
      .thales-proof-exercise #time-control label { white-space: nowrap; }
      .thales-proof-exercise #time-slider { min-width: 0; }
      .thales-proof-exercise .proof-ratio-input-label,
      .thales-proof-exercise .proof-cross-product-label { flex-basis: 100%; }
      .thales-proof-exercise #presentation-control { margin-left: 0 !important; }
      .thales-proof-exercise .proof-display { font-size: 1.125rem; }

      .thales-proof-exercise .proof-choice-button,
      .thales-proof-exercise .proof-option { padding: 8px; }
    }

    .thales-converse-theorem-slideshow { overflow-y: scroll; }
    .thales-converse-theorem-slideshow .main-content { align-items: flex-start; }
    .thales-converse-theorem-slideshow .nav-list { flex-wrap: wrap; }
    .thales-converse-theorem-slideshow .proof-display {
      font-size: clamp(1rem, 2vw, 1.4rem);
      line-height: 1.55;
      color: #FF8A80;
    }
    .thales-converse-theorem-slideshow .step-correction-layout { display: block; }
    .thales-converse-theorem-slideshow .step-correction-content { min-width: 0; }
    .thales-converse-theorem-slideshow .proof-box { border-color: #FF8A80; }

    /* Raccordement de la trigonométrie : espace pour les annotations et les
       formules, sans changer la présentation des familles existantes. */
    .trigonometry-exercise .main-content {
      min-width: 0;
      padding: clamp(8px, 2vw, 20px);
    }
    .trigonometry-exercise .question-container {
      min-width: 0;
      width: 100%;
      padding: clamp(12px, 3vw, 45px);
    }
    .trigonometry-exercise .exercise-statement {
      font-size: clamp(1.15rem, 2.6vw, 2.4rem);
    }
    .trigonometry-exercise #exercise-figure,
    .trigonometry-exercise .step-correction-figure {
      width: 680px;
      max-width: 100%;
    }
    .trigonometry-exercise #exercise-figure svg,
    .trigonometry-exercise .step-correction-figure svg {
      max-width: 100%;
      /* La largeur seule agrandissait excessivement les rotations verticales.
         Le ratio SVG « meet » réduit tout le dessin, annotations comprises,
         sans agrandir les configurations déjà sous ce plafond. Les marges
         du viewBox partagé restent intégralement disponibles. */
      max-height: clamp(300px, 40vw, 480px);
    }
    .trigonometry-exercise .proof-display {
      font-size: clamp(1.05rem, 2.2vw, 1.8rem);
    }
    .trigonometry-exercise .proof-display > svg {
      margin: 12px auto;
    }
    /* Rouge plus lumineux sur le fond sombre du lecteur pour la projection.
       Les SVG et les contenus exportés conservent leurs couleurs d'origine. */
    .trigonometry-exercise .proof-display,
    .trigonometry-exercise .proof-display > span {
      color: var(--correction-red, #FF8A80) !important;
    }
    .trigonometry-exercise #exercise-content [fill="red"] { fill: var(--correction-red, #FF8A80); }
    .trigonometry-exercise #exercise-content [stroke="red"] { stroke: var(--correction-red, #FF8A80); }
    .trigonometry-exercise #trigonometry-response-correction { margin-top: 24px; }
    .trigonometry-exercise .proof-choice { max-width: 100%; }
    .pythagoras-trigonometry-exercise .proof-display {
      max-width: 100%;
      overflow-x: auto;
    }
    @media (max-width: 600px) {
      .pythagoras-trigonometry-exercise .proof-choice-input {
        flex-wrap: wrap;
        max-width: 100%;
        gap: 8px;
      }
      .pythagoras-trigonometry-exercise .proof-choice-input-label { width: 100%; }
      .pythagoras-trigonometry-exercise .proof-choice-input .proof-choice {
        width: auto;
        min-width: 0;
        flex: 1 1 160px;
      }
      .pythagoras-trigonometry-exercise .proof-choice-input .proof-input-field {
        box-sizing: border-box;
        flex: 0 0 100px;
        max-width: 100%;
      }
      .trigonometry-exercise .exercise-statement { font-size: clamp(.8rem, 3.6vw, 1.15rem); }
      .trigonometry-exercise .nav-list { flex-wrap: wrap; gap: 8px; }
      .trigonometry-exercise .nav-link { padding: 6px 8px; }
      .trigonometry-exercise #presentation-control { margin-left: 0 !important; }
      .trigonometry-exercise .correction-overlay { font-size: 2.5rem; }
      .trigonometry-exercise .correction-overlay .overlay-content { gap: 32px; }
    }

    .exercise-statement {
      font-size: 2.4em;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 0px;
      text-align: center;
    }

    #exercise-figure,
    .step-correction-figure {
      width: 520px;
      max-width: 80%;
      margin: 0 auto;
    }

    #exercise-figure svg,
    .step-correction-figure svg {
      width: 100%;
      max-width: 520px;
      max-height: 360px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    #exercise-figure:has(.thales-figure),
    .step-correction-figure:has(.thales-figure) {
      width: 450px;
      max-width: 90%;
    }

    #exercise-figure .thales-figure,
    .step-correction-figure .thales-figure {
      width: 100%;
      max-width: 450px;
      max-height: none;
      height: auto;
    }

    .proof-choice {
      width: 600px;
      max-width: 90%;
      margin: 20px auto;
    }

    .proof-choice-button,
    .proof-option {
      width: 100%;
      padding: 12px;
      margin-bottom: 6px;
      font-size: 18px;
    }

    .proof-choice-options {
      display: flex;
      flex-direction: column;
    }

    .proof-choice.correct {
      outline: 2px solid green;
    }

    .proof-choice.incorrect {
      outline: 2px solid red;
    }

    .proof-choice.unanswered {
      outline: 2px solid orange;
    }

    .step-correction-layout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
    }

    .step-correction-side {
      width: 420px;
      flex-shrink: 0;
      font-size: 2.2em;
      font-weight: 600;
      text-align: left;
    }

    .proof-box {
      display: inline-block;
      border: 3px solid var(--correction-red);
      padding: 4px 10px;
    }

    #submit-answer {
      margin: 20px auto;
    }

    #user-answer {
      display: inline-block;
      padding: 10px 14px;
      font-size: 1.2em;
      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
      text-align: center;
    }

    #user-answer:focus {
      border-color: #555;
    }

    .proof-display {
      color: var(--correction-red);
      font-size: 1.8em;
    }

    .proof-choice-input {
      width: 600px;
      max-width: 90%;
      margin: 20px auto;

      display: flex;
      align-items: center;
      gap: 16px;
    }

    .proof-choice-input-label {
      width: 180px;
      flex-shrink: 0;
      font-size: 18px;
    }

    .proof-choice-input .proof-choice {
      width: 220px;
      flex: none;
      margin: 0;
    }

    .proof-choice-input .proof-input-field {
      width: 120px;
      padding: 10px 14px;

      font-size: 1.2em;
      text-align: center;

      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .proof-choice-input .proof-input-field:focus {
      border-color: #555;
    }

    /* Correction progressive de Thalès */
    .thales-correspondence-equality {
      display: inline-block;
    }

    .thales-correspondence-overlay {
      position: absolute;
      inset: 0;
      overflow: visible;
      pointer-events: none;
      z-index: 10;
    }

    .thales-ratio-equality {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      white-space: nowrap;
      color: black;
    }

    .thales-ratio-part {
      display: inline-flex;
      align-items: center;
      gap: 12px;
    }

    .thales-ratio-fraction {
      display: inline-flex;
      align-items: center;
      min-height: 2.9em;
    }

    .thales-ratio-fraction mjx-frac {
      min-width: 2.05em;
    }

    .thales-direct-exercise .proof-box { max-width: 100%; box-sizing: border-box; }
    .thales-direct-exercise .thales-given-length { display: inline-block; max-width: 100%; }

    @media (max-width: 960px) {
      .thales-direct-exercise .step-correction-layout { flex-direction: column; gap: 24px; }
      .thales-direct-exercise .step-correction-side { max-width: 100%; text-align: center; }
      .thales-direct-exercise .thales-correspondence-equality { max-width: 100%; }
      .thales-direct-exercise .thales-ratio-equality { flex-wrap: wrap; justify-content: center; }
    }

    @media (max-width: 768px) {
      .thales-direct-exercise .main-content { padding: 8px; min-width: 0; }
      .thales-direct-exercise .question-container { width: 100%; padding: 12px; box-sizing: border-box; }
      .thales-direct-exercise .nav-list { flex-wrap: wrap; gap: 8px; }
      .thales-direct-exercise .nav-link { padding: 6px 8px; }
      .thales-direct-exercise #presentation-control { margin-left: 0 !important; }
      .thales-direct-exercise .proof-choice { max-width: 100%; }
      .thales-direct-exercise .proof-choice-button,
      .thales-direct-exercise .proof-option { padding: 8px; }
    }

    .thales-proof-inline {
      display: inline-block;
      white-space: nowrap;
    }

    .thales-proof-transition {
      display: inline-block;
      margin: 0 0.35em;
    }

    .proof-display {
      line-height: 1.55;
    }

    .proof-choice[data-step-id^="parallel-"] {
      width: 900px;
      max-width: 95%;
    }

    .proof-choice[data-step-id="secantStatement"],
    .proof-choice[data-step-id="ratioEquality"],
    .proof-choice[data-step-id="crossProductComparison"],
    .proof-choice[data-step-id="ratioComparison"],
    .proof-choice[data-step-id="parallelismTheorem"],
    .proof-choice[data-step-id="parallelismConclusion"],
    .proof-choice[data-step-id="sameOrder"],
    .proof-choice[data-step-id="thalesConverseStatement"],
    .proof-choice[data-step-id="parallelConclusion"] {
      width: 1000px;
      max-width: 95%;
    }

    /* Mode réponse — réciproque de Thalès :
       deux rapports sur une même ligne */

    .proof-ratio-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 40px;
      width: 100%;
      margin: 20px auto;
    }

    .proof-ratio-input {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: auto;
      margin: 0;
    }

    .proof-ratio-input-label {
      flex-shrink: 0;
      white-space: nowrap;
      font-size: 18px;
    }

    .proof-ratio-input .proof-choice {
      width: 110px;
      max-width: none;
      flex: none;
      margin: 0;
    }

    .proof-ratio-equal {
      flex-shrink: 0;
      font-size: 1.4em;
    }

    .proof-ratio-fraction {
      display: inline-flex;
      flex-direction: column;
      align-items: stretch;
      width: 100px;
    }

    .proof-ratio-fraction .proof-input-field {
      box-sizing: border-box;
      width: 100px;
      height: 38px;
      margin: 0;
      padding: 6px 10px;

      font-size: 1.2em;
      text-align: center;

      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .proof-ratio-fraction .proof-input-field:focus {
      border-color: #555;
    }

    .proof-ratio-bar {
      display: block;
      width: 100%;
      height: 2px;
      margin: 3px 0;
      background: white;
    }

    /* Produits en croix — réciproque de Thalès */

    .proof-cross-product-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 35px;
      width: 100%;
      margin: 20px auto;
    }

    .proof-cross-product-input {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      white-space: nowrap;
      font-size: 18px;
    }

    .proof-cross-product-factor {
      min-width: 30px;
      text-align: center;
    }

    .thales-proof-exercise .proof-ratio-expression,
    .thales-proof-exercise .proof-cross-product-expression,
    .thales-proof-exercise .proof-cross-product-multiplier,
    .thales-proof-exercise .proof-cross-product-answer {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      max-width: 100%;
    }

    .thales-proof-exercise .proof-cross-product-expression { flex-wrap: wrap; }
    .thales-proof-exercise .proof-cross-product-factor { overflow-wrap: anywhere; }

    .proof-cross-product-result {
      box-sizing: border-box;
      width: 110px;
      padding: 8px 10px;

      font-size: 1.1em;
      text-align: center;

      border: 2px solid #ccc;
      border-radius: 6px;
      outline: none;
    }

    .proof-cross-product-result:focus {
      border-color: #555;
    }

    /* ==========================================
      FEEDBACK — RÉCIPROQUE DE THALÈS
      ========================================== */

    /* Rapport : numérateur et dénominateur */

    .proof-ratio-fraction
    .proof-input-field.correct {
      border-color: #22c55e;
      outline: 2px solid #22c55e;
    }

    .proof-ratio-fraction
    .proof-input-field.incorrect {
      border-color: #ef4444;
      outline: 2px solid #ef4444;
    }

    .proof-ratio-fraction
    .proof-input-field.unanswered {
      border-color: #f59e0b;
      outline: 2px solid #f59e0b;
    }

    /* Produit en croix : résultat individuel */

    .proof-cross-product-input
    .proof-cross-product-result.correct {
      border-color: #22c55e;
      outline: 2px solid #22c55e;
    }

    .proof-cross-product-input
    .proof-cross-product-result.incorrect {
      border-color: #ef4444;
      outline: 2px solid #ef4444;
    }

    .proof-cross-product-input
    .proof-cross-product-result.unanswered {
      border-color: #f59e0b;
      outline: 2px solid #f59e0b;
    }
  </style>

  <script
    id="MathJax-script"
    defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"
  ></script>
</head>

        align-items:center;
        gap:12px;

        style="
          color:white;
          font-weight:600;
        "
      >
        Mode :
      </span>

      <div

          display:flex;
          gap:8px;
        "

          type="button"
          style="
            padding:6px 12px;
            background:#4CAF50;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-weight:600;
          "
        >
          Réponse
        </button>

        <button
          id="mode-slideshow"
          class="presentation-btn"
          type="button"
          style="
            padding:6px 12px;
            background:#666;
            color:white;
            border:none;
            border-radius:4px;
            cursor:pointer;
            font-weight:600;
          "
        >
          Diaporama
        </button>
      </div>
    </div>

    <button
      id="pause-timer"
      type="button"
      style="
        display:none;
        padding:6px 14px;
        cursor:pointer;
      "
    >
      Pause
    </button>

  </div>

  <main class="main-content">
    <section class="question-container">

      <header class="question-header">
        <h1 id="exercise-title" class="question-title">Exercice</h1>
        <div id="timer" class="timer">30</div>
      </header>

      <div
        id="exercise-content"
      ></div>

      <div
        id="correction-overlay"
        class="correction-overlay"
        style="display:none;"
      >
        <div class="overlay-content">
          <div class="question-title overlay-title">
            Correction
          </div>

          <p class="overlay-subtext">
            Appuyez sur Entrée pour commencer
          </p>
        </div>
      </div>

    </section>
  </main>

  <script type="module">

    import { setAnswerControlsLocked } from "./core/answerLock.js";

    import {
      displayPresentationMode,
      setModeButtonsDisabled
    } from "./core/modes.js";

    import {
      showTimer,
      hideTimer,
      hideTimerImmediately,
      resetTimer,
      stopTimer,
      pauseTimer,
      resumeTimer,
      getIsPaused
    } from "./core/timer.js";

    import {
      generatePythagorasExercise
    } from "./exercices/generators/pythagorasGenerator.js";

    import {
      createRightTriangleSVG
    } from "./exercices/figures/rightTriangle.js";

    import {
      formatAnswer
    } from "./core/answerFormatting.js";

    import {
      createPythagorasProof
    } from "./exercices/pythagore/pythagorasProof.js";

    import {
      createPythagorasStudentProof
    } from "./exercices/pythagore/pythagorasStudentProof.js";

    import {
      createProofChoiceMenu
    } from "./core/proofChoice.js";

    import {
      evaluateCurrentAnswer
    } from "./core/answerEvaluation.js";

    import {
      displayAnswerFeedback
    } from "./core/answerFeedback.js";

    import {
      validateProofChoices
    } from "./core/proofValidation.js";

    import {
      initializeKeyboardShortcuts
    } from "./core/keyboardShortcuts.js";

    import {
      showCorrectionOverlay,
      hideCorrectionOverlay
    } from "./core/correctionOverlay.js";

    import {
      createStepCorrection
    } from "./core/stepCorrection.js";

    import {
      renderStepCorrection as renderBaseStepCorrection,
      createCompleteCorrectionScene
    } from "./core/stepCorrectionRenderer.js";

    import {
      createPythagorasCorrectionScenes
    } from "./exercices/pythagore/pythagorasCorrectionScenes.js";

    import {
      deepMerge
    } from "./core/deepMerge.js";

    import {
      createThalesFigure
    } from "./exercices/figures/thalesFigure.js";

    import {
      generateThalesExercise
    } from "./exercices/generators/thalesGenerator.js";

    import {
      createThalesCorrectionScenes
    } from "./exercices/thales/thalesCorrectionScenes.js";

    import {
      generateThalesParallelism, createThalesParallelismStatement
    } from "./exercices/generators/thalesParallelismGenerator.js";
    import { wrapThalesProof } from "./exercices/thales/thalesProofFlow.js";

    import {
      createThalesParallelismCorrectionScenes
    } from "./exercices/thales/thalesConverseCorrectionScenes.js";

    import {
      createThalesProof
    } from "./exercices/thales/thalesProof.js";

    import {
      createThalesStudentProof
    } from "./exercices/thales/thalesStudentProof.js";

    import {
      createThalesParallelismProof
    } from "./exercices/thales/thalesConverseProof.js";

    import {
      createThalesParallelismStudentProof
    } from "./exercices/thales/thalesConverseStudentProof.js";

    import {
      drawThalesCorrespondenceArrow
    } from "./exercices/thales/thalesCorrectionArrow.js";

    import {
      createThalesParallelProof
    } from "./exercices/thales/thalesParallelProof.js";

    import {
      generatePythagorasConverseExercise
    } from "./exercices/generators/pythagorasConverseGenerator.js";

    import {
      createPythagorasConverseProof
    } from "./exercices/pythagore/pythagorasConverseProof.js";

    import {
      createStudentProof
    } from "./core/studentProof.js";

    import {
      createStudentProofElement
    } from "./core/studentProofRenderer.js";

    import {
      validateStudentProof
    } from "./core/proofValidation.js";

    import {
      createPythagorasConverseCorrectionScenes
    } from "./exercices/pythagore/pythagorasConverseCorrectionScenes.js";

    import {
      exerciseConfigs
    } from "./core/exerciseRegistry.js";

    import {
      exportGeneratedExercise
    } from "./core/export/exportGeneratedExercise.js";

    import {
      openExportDialog
    } from "./core/export/exportDialog.js";

    import { generateTrigonometryExercise } from "./exercices/generators/trigonometryGenerator.js";
    import { generateTrigonometryAngleExercise } from "./exercices/generators/trigonometryAngleGenerator.js";
    import { createTrigonometryFigureSVG } from "./exercices/trigonometry/trigonometryFigure.js";
    import { createTrigonometryCorrectionPresentation, createTrigonometryExportCorrectionScenes, createTrigonometryResponseCorrectionScene } from "./exercices/trigonometry/trigonometryCorrectionScenes.js";
    import { createTrigonometryAngleCorrectionPresentation, createTrigonometryAngleExportCorrectionScenes, createTrigonometryAngleResponseCorrectionScene } from "./exercices/trigonometry/trigonometryAngleCorrectionScenes.js";
    import { createTrigonometryStudentProof } from "./exercices/trigonometry/trigonometryStudentProof.js";
    import { getThalesSegmentName } from "./exercices/thales/thalesProof.js";
    import { generateThalesConverseTheoremExercise } from "./exercices/generators/thalesConverseTheoremGenerator.js";
    import { createThalesConverseTheoremStudentProof, createThalesConverseTheoremCorrectionScenes, createThalesConverseTheoremSlideshowStatement, createThalesConverseTheoremSlideshowFigure, evaluateThalesConverseTheoremAnswer } from "./exercices/thales/thalesConverseTheorem.js";
    import { generatePythagorasTrigonometryExercise } from "./exercices/generators/pythagorasTrigonometryGenerator.js";
    import { createPythagorasTrigonometryFigureSVG, createPythagorasTrigonometryCorrectionPresentation,
      createPythagorasTrigonometryExportCorrectionScenes, createPythagorasTrigonometryStudentProof,
      preparePythagorasTrigonometryResponse, createPythagorasTrigonometryResponseCorrectionScene } from "./exercices/pythagore/pythagorasTrigonometry.js";
    import { correctionHtml } from './core/correctionColors.js';
    import { renderMath, clearMath } from "./core/mathRendering.js";

    let currentExercise =
      null;

    function generateCurrentExercise() {
      if (!exerciseConfig) {
        return null;
      }

      const {
        type,
        family
      } = exerciseConfig;

      if (family === "trigonometry") {
        if (type === "pythagoras-angle") return generatePythagorasTrigonometryExercise();
        return type === "angle" ? generateTrigonometryAngleExercise() : generateTrigonometryExercise();
      }

      if (
        family ===
        "thales"
      ) {
        return generateThalesExercise(
          type
        );
      }

      if (
        family ===
        "thalesConverse"
      ) {
        if (type === "converse-theorem") return generateThalesConverseTheoremExercise();
        return generateThalesParallelism({
          mode: exerciseConfig.mode ?? "reciproque",
          type
        });
      }

      if (
        family ===
        "pythagorasConverse"
      ) {
        return generatePythagorasConverseExercise(
          type
        );
      }

      if (
        family ===
        "pythagoras"
      ) {
        return generatePythagorasExercise(
          type
        );
      }

      return null;
    }

    const exerciseContent =
      document.getElementById(
        "exercise-content"
      );

    let validateCurrentResponse = null;

    function displayExercise(
      generatedExercise
    ) {
      if (!generatedExercise) {
        exerciseContent.textContent =
          "Impossible de générer l'exercice.";

        return;
      }

      const sideLabels =
        (exerciseConfig.family === "trigonometry" || exerciseConfig.family ===
          "thales" ||
        exerciseConfig.family ===
          "thalesConverse")
          ? null
          : {
              leg1:
                generatedExercise.unknownSide ===
                "leg1"
                  ? "?"
                  : `${formatAnswer(
                      generatedExercise.lengths.leg1
                    )} ${generatedExercise.unit}`,

              leg2:
                generatedExercise.unknownSide ===
                "leg2"
                  ? "?"
                  : `${formatAnswer(
                      generatedExercise.lengths.leg2
                    )} ${generatedExercise.unit}`,

              hypotenuse:
                generatedExercise.unknownSide ===
                "hypotenuse"
                  ? "?"
                  : `${formatAnswer(
                      generatedExercise.lengths.hypotenuse
                    )} ${generatedExercise.unit}`
            };

      let question =
        null;

      if (exerciseConfig.family === "trigonometry") {
        question = generatedExercise.question;
      }

      if (
        exerciseConfig.family ===
        "pythagoras"
      ) {
        const expectedAnswer =
          generatedExercise.lengths[
            generatedExercise.unknownSide
          ];

        question = {
          answers: [
            `${formatAnswer(
              expectedAnswer
            )} ${generatedExercise.unit}`
          ],

          answerRule: {
            type: "length",
            unit:
              generatedExercise.unit
          }
        };
      }

      if (
        exerciseConfig.family ===
        "thales" || exerciseConfig.type === "converse-theorem"
      ) {
        const expectedAnswer =
          generatedExercise.lengths[
            generatedExercise.unknownSegment
          ];

        question = {
          answers: [
            `${formatAnswer(
              expectedAnswer
            )} ${generatedExercise.unit}`
          ],

          answerRule: {
            type: "length",
            unit:
              generatedExercise.unit
          }
        };
      }

      if (exerciseConfig.family === "trigonometry" || exerciseConfig.family === "thales" || mathjaxPythagoras) clearMath(exerciseContent);
      if (exerciseConfig.type === "converse-theorem") clearMath(exerciseContent.querySelector(".exercise-statement"));
      exerciseContent.innerHTML = `
        <div class="exercise-statement">
          ${exerciseConfig.type === "converse-theorem" ? createThalesConverseTheoremSlideshowStatement(generatedExercise)
            : exerciseConfig.family === "thalesConverse" ? createThalesParallelismStatement(generatedExercise) : generatedExercise.statement}
        </div>

        <div id="exercise-figure"></div>
      `;

      if (exerciseConfig.type === "converse-theorem") updateThalesStatement(generatedExercise);
      const figureContainer =
        document.getElementById(
          "exercise-figure"
        );

      if (exerciseConfig.family === "trigonometry") {
        figureContainer.innerHTML = exerciseConfig.type === "pythagoras-angle"
          ? createPythagorasTrigonometryFigureSVG(generatedExercise)
          : createTrigonometryFigureSVG(generatedExercise);
      } else if (
        exerciseConfig.family ===
          "thales" ||
        exerciseConfig.family ===
          "thalesConverse"
      ) {
        figureContainer.innerHTML =
          createThalesFigure(
            exerciseConfig.type === "converse-theorem" ? createThalesConverseTheoremSlideshowFigure(generatedExercise) : generatedExercise.figureOptions
          );

        if (
          exerciseConfig.family !== "thales" &&
          exerciseConfig.type !== "converse-theorem" &&
          window.MathJax &&
          typeof MathJax.typesetPromise ===
            "function"
        ) {
          MathJax.typesetPromise([
            exerciseContent
          ]);
        }
      } else {
        figureContainer.innerHTML =
          createRightTriangleSVG({
          vertices:
            generatedExercise.vertices,

          rotation:
            generatedExercise
              .figureOptions
              .rotation,

          dimensions:
            generatedExercise
              .figureOptions
              .dimensions,

          rightAngle: {
            visible:
              exerciseConfig.family ===
              "pythagoras",

            size: 20
          },

          sides: {
            leg1: {
              label: sideLabels.leg1,
              color: "currentColor",
              strokeWidth: 3,
              fontSize: 22,
              labelColor: "currentColor",
              labelOffset: 24,

              annotation: {
                text: "",
                fontSize: 18,
                color: "currentColor",
                offset: 22
              }
            },

            leg2: {
              label: sideLabels.leg2,
              color: "currentColor",
              strokeWidth: 3,
              fontSize: 22,
              labelColor: "currentColor",
              labelOffset: 24,

              annotation: {
                text: "",
                fontSize: 18,
                color: "currentColor",
                offset: 22
              }
            },

            hypotenuse: {
              label: sideLabels.hypotenuse,
              color: "currentColor",
              strokeWidth: 3,
              fontSize: 22,
              labelColor: "currentColor",
              labelOffset: 24,

              annotation: {
                text: "",
                fontSize: 18,
                color: "currentColor",
                offset: 22
              }
            }
          }
        });
      }

      if (
        presentationMode ===
        "response"
      ) {
        let proof;
        let studentProof;

        if (exerciseConfig.family === "trigonometry") {
          proof = [];
          studentProof = exerciseConfig.type === "pythagoras-angle"
            ? createPythagorasTrigonometryStudentProof(generatedExercise)
            : createTrigonometryStudentProof(generatedExercise, { mathjax: true });
        } else if (
          exerciseConfig.family ===
          "pythagorasConverse"
        ) {
          proof =
            createPythagorasConverseProof(
              generatedExercise, { mathjax: true }
            );

          studentProof =
            createStudentProof(
              proof
            ).map(step => step.kind === "choiceInput" ? { ...step, mathjax: true } : step);
        } else if (
          exerciseConfig.family ===
          "thales"
        ) {
          const thalesProof =
            createThalesProof(
              generatedExercise, { wrap: true }
            );

          if (
            generatedExercise
              .requiresParallelProof
          ) {
            proof = [
              ...createThalesParallelProof(
                generatedExercise
              ),

              ...thalesProof.filter(
                step =>
                  step.id !==
                  "parallelStatement"
              )
            ];
          } else {
            proof =
              thalesProof;
          }

          studentProof =
            createThalesStudentProof(
              proof
            );
        } else if (
          exerciseConfig.family ===
          "thalesConverse"
        ) {
          proof =
            createThalesParallelismProof(
              generatedExercise
            );

          studentProof = exerciseConfig.type === "converse-theorem"
            ? createThalesConverseTheoremStudentProof(generatedExercise)
            : createThalesParallelismStudentProof(proof, generatedExercise);
        } else {
          proof =
            createPythagorasProof(
              generatedExercise
            );

          studentProof =
            createPythagorasStudentProof(
              proof
            );
        }

        const proofContainer =
          document.createElement(
            "div"
          );

        proofContainer.id =
          "student-proof";

        let ratioRow = null;
        let crossProductRow = null;

        studentProof.forEach(
          step => {
            const usesStudentProofRenderer =
              exerciseConfig.type === "pythagoras-angle" ||
              exerciseConfig.family ===
                "pythagorasConverse" ||
              exerciseConfig.family ===
                "thales" ||
              exerciseConfig.family ===
                "thalesConverse";

            const element =
              usesStudentProofRenderer
                ? createStudentProofElement(
                    step, exerciseConfig.family === "thalesConverse" ? wrapThalesProof : undefined
                  )
                : createProofChoiceMenu(
                    step
                  );

            if (!element) {
              return;
            }

            if (
              exerciseConfig.family ===
                "thalesConverse" &&
              step.kind ===
                "ratioInput"
            ) {
              if (!ratioRow) {
                ratioRow =
                  document.createElement(
                    "div"
                  );

                ratioRow.className =
                  "proof-ratio-row";

                proofContainer.appendChild(
                  ratioRow
                );
              }

              ratioRow.appendChild(
                element
              );

              return;
            }

            if (
              exerciseConfig.family ===
                "thalesConverse" &&
              step.kind ===
                "crossProductInput"
            ) {
              if (!crossProductRow) {
                crossProductRow =
                  document.createElement(
                    "div"
                  );

                crossProductRow.className =
                  "proof-cross-product-row";

                proofContainer.appendChild(
                  crossProductRow
                );
              }

              crossProductRow.appendChild(
                element
              );

              return;
            }

            proofContainer.appendChild(
              element
            );
          }
        );

        exerciseContent.appendChild(
          proofContainer
        );

        const answerContainer =
          document.createElement(
            "div"
          );

        answerContainer.id =
          "exercise-answer";

        if (exerciseConfig.type !== "converse-theorem" && (
          exerciseConfig.family === "pythagorasConverse" ||
          exerciseConfig.family === "thalesConverse"
        )) {
          answerContainer.innerHTML = `
            <button
              id="submit-answer"
              type="button"
            >
              Valider
            </button>

            <div
              id="proof-feedback"
              class="feedback"
            ></div>
          `;
        } else {
          answerContainer.innerHTML = `
            <input
              type="text"
              id="user-answer"
              placeholder="Votre réponse"
            >

            <button
              id="submit-answer"
              type="button"
            >
              Valider
            </button>

            <div
              id="feedback"
              class="feedback"
            ></div>

            <div
              id="proof-feedback"
              class="feedback"
            ></div>
          `;
        }

        exerciseContent.appendChild(
          answerContainer
        );

        const userAnswerInput =
          document.getElementById(
            "user-answer"
          );

        if (exerciseConfig.family === "pythagoras") {
          const segment = generatedExercise.sideNames[generatedExercise.unknownSide];
          const label = document.createElement("label");
          label.className = "pythagoras-final-answer";
          label.htmlFor = "user-answer";
          label.innerHTML = String.raw`\(\mathrm{${segment}}=\)`;
          userAnswerInput.setAttribute("aria-label", `Longueur ${segment}, valeur et unité`);
          userAnswerInput.removeAttribute("placeholder");
          userAnswerInput.before(label);
          label.appendChild(userAnswerInput);
        }
        if (exerciseConfig.family === "thales" || exerciseConfig.type === "converse-theorem") {
          const unknown = generatedExercise.unknownSegment;
          const segment = getThalesSegmentName(generatedExercise, unknown);
          const labelSegment = exerciseConfig.type === "converse-theorem"
            ? getThalesSegmentName(generatedExercise, [...unknown].reverse().join(""))
            : segment;
          userAnswerInput.setAttribute("aria-label", `Longueur ${segment}, valeur et unité`);
          userAnswerInput.removeAttribute("placeholder");
          const label = document.createElement("label");
          label.className = "thales-final-answer";
          label.htmlFor = "user-answer";
          label.innerHTML = String.raw`\(\mathrm{${labelSegment}}=\) `;
          userAnswerInput.before(label);
          label.appendChild(userAnswerInput);
        }
        if (exerciseConfig.family === "trigonometry") {
          const isAngle = exerciseConfig.type !== "length";
          userAnswerInput.removeAttribute("placeholder");
          userAnswerInput.setAttribute("aria-label", isAngle
            ? "Mesure de l’angle arrondie au degré, avec le symbole °"
            : "Longueur arrondie au dixième, avec son unité");
          const label = document.createElement("label");
          label.className = "trigonometry-final-answer";
          label.htmlFor = "user-answer";
          const name = isAngle
            ? String.raw`\widehat{\mathrm{${generatedExercise.angle.name}}}`
            : String.raw`\mathrm{${generatedExercise.sideNames[generatedExercise.unknownSide]}}`;
          label.innerHTML = String.raw`\(${name}=\)`;
          userAnswerInput.before(label);
          label.appendChild(userAnswerInput);
        }

        const submitAnswerButton =
          document.getElementById(
            "submit-answer"
          );

        const answerFeedback =
          document.getElementById(
            "answer-feedback"
          );

        let responseLocked = false;
        validateCurrentResponse = function() {
          if (responseLocked) return;
          responseLocked = true;
          setAnswerControlsLocked(true, {
            containers: [proofContainer, userAnswerInput],
            submitButton: submitAnswerButton
          });
          stopTimer();

        const usesStudentProofValidation =
          exerciseConfig.type === "pythagoras-angle" ||
          exerciseConfig.family ===
            "pythagorasConverse" ||
          exerciseConfig.family ===
            "thales" ||
          exerciseConfig.family ===
            "thalesConverse";

          if (exerciseConfig.type === "pythagoras-angle") preparePythagorasTrigonometryResponse(proofContainer, generatedExercise);
          const proofResults =
            usesStudentProofValidation
              ? validateStudentProof(
                  proofContainer
                )
              : validateProofChoices(
                  proofContainer
                );

          function isProofResultAnswered(
            result
          ) {
            if (
              "isAnswered" in result
            ) {
              return result.isAnswered;
            }

            if (
              "isChoiceAnswered" in result &&
              "isInputAnswered" in result
            ) {
              return (
                result.isChoiceAnswered &&
                result.isInputAnswered
              );
            }

            return false;
          }

          const proofFeedback =
            document.getElementById(
              "proof-feedback"
            );

          const correctProofCount =
            proofResults.filter(
              result =>
                result.isCorrect
            ).length;

          const unansweredProofCount =
            proofResults.filter(
              result =>
                !isProofResultAnswered(
                  result
                )
            ).length;

          const incorrectProofCount =
            proofResults.filter(
              result =>
                isProofResultAnswered(
                  result
                ) &&
                !result.isCorrect
            ).length;

          if (
            correctProofCount ===
            proofResults.length
          ) {
            proofFeedback.textContent =
              "Démonstration correcte !";

            proofFeedback.style.color =
              "green";
          } else {
            proofFeedback.textContent =
              `${correctProofCount} correcte(s), ` +
              `${incorrectProofCount} incorrecte(s), ` +
              `${unansweredProofCount} non répondue(s).`;

            proofFeedback.style.color =
              "red";
          }

          if (exerciseConfig.family === "trigonometry" && exerciseConfig.type === "angle" && correctProofCount !== proofResults.length) {
            proofFeedback.textContent = `Étapes validées : ${correctProofCount}/${proofResults.length}. ` +
              `Choix à revoir : ${incorrectProofCount}. Étapes non renseignées : ${unansweredProofCount}.`;
          }

          if (
            exerciseConfig.family ===
              "pythagoras" ||
            exerciseConfig.family ===
              "thales" || exerciseConfig.type === "converse-theorem" || exerciseConfig.family === "trigonometry"
          ) {
            const evaluation = exerciseConfig.type === "converse-theorem"
              ? evaluateThalesConverseTheoremAnswer(generatedExercise, userAnswerInput.value)
              : evaluateCurrentAnswer({
                question,
                answerMode: "direct",
                selectedQCMAnswer: null
              });

            const isNotAnswered =
              evaluation.userAnswer === "";

            displayAnswerFeedback({
              isCorrect:
                evaluation.isCorrect,

              isNotAnswered,

              correctAnswer:
                evaluation.correctAnswer,

              displayAnswer: exerciseConfig.family === "pythagoras"
                ? proof.at(-1).correct
                : exerciseConfig.family === "trigonometry"
                  ? exerciseConfig.type === "length"
                    ? String.raw`\(${formatAnswer(generatedExercise.roundedAnswer, "math")}~\mathrm{${generatedExercise.unit}}\)`
                    : String.raw`\(${generatedExercise.roundedAnswer}^\circ\)`
                  : exerciseConfig.family === "thales"
                    ? String.raw`\(${formatAnswer(generatedExercise.lengths[generatedExercise.unknownSegment], "math")}~\mathrm{${generatedExercise.unit}}\)`
                    : undefined,

              incorrectFeedback:
                evaluation.result.feedback,

              answerMode:
                "direct",

              userAnswer:
                evaluation.userAnswer,

              showCorrectAnswer:
                exerciseConfig.family === "trigonometry" && ["angle", "pythagoras-angle"].includes(exerciseConfig.type)
                  ? true
                  : evaluation.result.showCorrectAnswer ?? true
            });
            if (["pythagoras", "trigonometry", "thales"].includes(exerciseConfig.family)) {
              renderMath(document.getElementById("feedback"));
            }
          }

          restartButton.style.display =
            "inline-block";

          exportExerciseButton.style.display =
            "inline-block";

          setModeButtonsDisabled(
            false
          );

          timeSlider.disabled =
            false;
          if (exerciseConfig.family === "trigonometry") {
            const correction = document.createElement("div");
            correction.id = "trigonometry-response-correction";
            exerciseContent.appendChild(correction);
            const scene = exerciseConfig.type === "pythagoras-angle"
              ? createPythagorasTrigonometryResponseCorrectionScene(generatedExercise)
              : exerciseConfig.type === "angle"
              ? createTrigonometryAngleResponseCorrectionScene(generatedExercise)
              : createTrigonometryResponseCorrectionScene(generatedExercise);
            // Garder les menus verrouillés et leurs erreurs visibles, puis
            // afficher toute la rédaction sous le retour de validation.
            if (exerciseConfig.type === "pythagoras-angle") {
              figureContainer.innerHTML = correctionHtml(createPythagorasTrigonometryFigureSVG(generatedExercise, scene.figure));
            }
            renderStepCorrection({ container: correction, scene: { html: scene.html } });
          }
        };

        submitAnswerButton.addEventListener(
          "click",
          validateCurrentResponse
        );

        if (exerciseConfig.family === "thalesConverse" || exerciseConfig.type === "pythagoras-angle") {
          proofContainer.addEventListener("keydown", event => {
            if (event.key !== "Enter" || event.shiftKey || event.ctrlKey || event.altKey ||
                event.metaKey || event.isComposing || !event.target.matches("input")) return;
            event.preventDefault();
            event.stopPropagation();
            submitAnswerButton.click();
          });
        }

        if (userAnswerInput) {
          userAnswerInput.addEventListener(
            "keydown",
            (event) => {
              if (event.key !== "Enter") {
                return;
              }

              event.preventDefault();

              submitAnswerButton.click();
            }
          );
        }

        if (!mathjaxPythagoras && !["trigonometry", "thales"].includes(exerciseConfig.family) && window.MathJax) {
          MathJax.typesetPromise([
            proofContainer,
            ...(exerciseConfig.type === "converse-theorem" ? [answerContainer] : [])
          ]);
        }
      }
      if (mathjaxPythagoras || ["trigonometry", "thales"].includes(exerciseConfig.family)) renderMath(exerciseContent);
    }

    const params =
      new URLSearchParams(
        window.location.search
      );

    const exercise =
      params.get("exercise");

    const exerciseConfig =
      exerciseConfigs[exercise];

    const mathjaxPythagoras = ["pythagoras", "pythagorasConverse"].includes(exerciseConfig?.family);
    if (exerciseConfig?.family === "pythagoras") document.body.classList.add("pythagoras-exercise");
    if (exerciseConfig?.family === "pythagorasConverse") document.body.classList.add("pythagoras-converse-exercise");
    if (exerciseConfig?.family === "thales") document.body.classList.add("thales-direct-exercise");
    if (exerciseConfig?.family === "thalesConverse") document.body.classList.add("thales-proof-exercise");
    if (exerciseConfig?.type === "converse-theorem") document.body.classList.add("thales-converse-theorem-exercise");
    if (exerciseConfig?.family === "trigonometry") {
      document.body.classList.add("trigonometry-exercise");
      if (exerciseConfig.type === "pythagoras-angle") document.body.classList.add("pythagoras-trigonometry-exercise");
      const prompt = document.querySelector("#correction-overlay .overlay-subtext");
      prompt.textContent = "Appuyer sur Entrée pour commencer";
    }

    const exerciseTitle =
      document.getElementById(
        "exercise-title"
      );

    exerciseTitle.textContent =
      exerciseConfig?.title ??
      "Exercice inconnu";

    const responseModeButton =
      document.getElementById(
        "mode-response"
      );

    const slideshowModeButton =
      document.getElementById(
        "mode-slideshow"
      );

    let presentationMode =
      "response";

    let waitingForCorrection =
      false;

    let correctionSteps =
      [];
    let trigonometryCompleteScene = null;

    let stepCorrection =
      null;

    // Initialisation de l'affichage
    displayPresentationMode(
      presentationMode
    );

    responseModeButton.addEventListener(
      "click",
      function() {
        presentationMode =
          "response";
        document.body.classList.remove("thales-converse-theorem-slideshow");

        displayPresentationMode(
          presentationMode
        );
      }
    );

    slideshowModeButton.addEventListener(
      "click",
      function() {
        presentationMode =
          "slideshow";
        if (exerciseConfig.type === "converse-theorem") document.body.classList.add("thales-converse-theorem-slideshow");

        displayPresentationMode(
          presentationMode
        );
      }
    );

    const startButton =
      document.getElementById(
        "start"
      );

    const restartButton =
      document.getElementById(
        "restart"
      );

    const exportExerciseButton =
      document.getElementById(
        "export-exercise"
      );

    const pauseButton =
      document.getElementById(
        "pause-timer"
      );

    const timeSlider =
      document.getElementById(
        "time-slider"
      );

    const timeValue =
      document.getElementById(
        "time-value"
      );

    let selectedTime =
      Number(
        timeSlider.value
      );

    timeValue.textContent =
      selectedTime;

    hideTimerImmediately();

    timeSlider.addEventListener(
      "input",
      function() {
        selectedTime =
          Number(
            timeSlider.value
          );

        timeValue.textContent =
          selectedTime;
      }
    );

    function handleTimeUp() {
      if (
        presentationMode ===
        "response"
      ) {
        validateCurrentResponse();
      }

      if (
        presentationMode ===
        "slideshow"
      ) {
        waitingForCorrection =
          true;

        showCorrectionOverlay();
      }
    }

    let thalesStatementVersion = 0;
    async function updateThalesStatement(exercise) {
      const target = exerciseContent.querySelector(".exercise-statement");
      if (!target) return;
      const version = ++thalesStatementVersion;
      target.dataset.mathReady = "false";
      const context = document.createElement("canvas").getContext("2d");
      // La mesure sert uniquement aux retours de ligne ; aucune mise à l'échelle.
      const fontSize = parseFloat(getComputedStyle(target).fontSize);
      context.font = `${fontSize * 1.13}px "Times New Roman"`;
      const available = target.clientWidth - 12;
      let maxWidth = available;
      for (let attempt = 0; attempt < 3; attempt++) {
        clearMath(target);
        target.innerHTML = createThalesConverseTheoremSlideshowStatement(exercise, {
          maxWidth, measure: text => context.measureText(text).width * 1.08
        });
        await renderMath(target, { targets: Array.from(target.children) });
        await document.fonts.ready;
        if (version !== thalesStatementVersion || !target.isConnected) return;
        const width = target.querySelector("mjx-math")?.getBoundingClientRect().width ?? 0;
        if (width <= available + 1) break;
        // Vérifier la largeur réellement composée, puis replier davantage si besoin.
        maxWidth *= available / width * .95;
      }
      target.dataset.mathReady = "true";
    }

    let thalesResizeFrame;
    if (exerciseConfig.type === "converse-theorem") {
      window.addEventListener("resize", () => {
        if (!currentExercise) return;
        cancelAnimationFrame(thalesResizeFrame);
        thalesResizeFrame = requestAnimationFrame(() => updateThalesStatement(currentExercise));
      });
    }

    function renderExerciseFigure(
      figureOptions
    ) {
      if (exerciseConfig.family === "trigonometry") {
        if (exerciseConfig.type === "pythagoras-angle") return createPythagorasTrigonometryFigureSVG(currentExercise, figureOptions ?? {});
        return createTrigonometryFigureSVG(currentExercise, figureOptions ?? {});
      }
      if (
        exerciseConfig.family ===
          "thales" ||
        exerciseConfig.family ===
          "thalesConverse"
      ) {
        return createThalesFigure(
          deepMerge(
            isConverseTheoremSlideshow() ? createThalesConverseTheoremSlideshowFigure(currentExercise) : currentExercise.figureOptions,
            figureOptions ?? {}
          )
        );
      }

      const baseOptions = {
        vertices:
          currentExercise.vertices,

        rotation:
          currentExercise
            .figureOptions
            .rotation,

        dimensions:
          currentExercise
            .figureOptions
            .dimensions,

        rightAngle: {
          visible: exerciseConfig.family === "pythagoras",
          size: 20
        },

        sides: {
          leg1: {
            label:
              currentExercise.unknownSide ===
              "leg1"
                ? "?"
                : `${formatAnswer(
                    currentExercise.lengths.leg1
                  )} ${currentExercise.unit}`,

            color: "currentColor",
            strokeWidth: 3,
            fontSize: 22,
            labelColor: "currentColor",
            labelOffset: 24,

            annotation: {
              text: "",
              fontSize: 18,
              color: "currentColor",
              offset: 22
            }
          },

          leg2: {
            label:
              currentExercise.unknownSide ===
              "leg2"
                ? "?"
                : `${formatAnswer(
                    currentExercise.lengths.leg2
                  )} ${currentExercise.unit}`,

            color: "currentColor",
            strokeWidth: 3,
            fontSize: 22,
            labelColor: "currentColor",
            labelOffset: 24,

            annotation: {
              text: "",
              fontSize: 18,
              color: "currentColor",
              offset: 22
            }
          },

          hypotenuse: {
            label:
              currentExercise.unknownSide ===
              "hypotenuse"
                ? "?"
                : `${formatAnswer(
                    currentExercise.lengths
                      .hypotenuse
                  )} ${currentExercise.unit}`,

            color: "currentColor",
            strokeWidth: 3,
            fontSize: 22,
            labelColor: "currentColor",
            labelOffset: 24,

            annotation: {
              text: "",
              fontSize: 18,
              color: "currentColor",
              offset: 22
            }
          }
        },

        arrow: {
          visible: false,

          fromVertex:
            "A",

          targetSide:
            "hypotenuse",

          color:
            "green",

          strokeWidth:
            3,

          startDistance:
            55,

          endOffset:
            18
        }
      };

      const mergedOptions =
        deepMerge(
          baseOptions,
          figureOptions
        );

      return createRightTriangleSVG(
        mergedOptions
      );
    }

    function isConverseTheoremSlideshow() {
      return exerciseConfig.type === "converse-theorem" && presentationMode === "slideshow";
    }

    // Le lecteur partagé travaille dans la zone située sous l'énoncé conservé.
    // Sa taille reste indépendante du nombre de lignes de la correction.
    function renderStepCorrection(options) {
      if (exerciseConfig.family === "thalesConverse" && options.scene?.html) {
        options = { ...options, scene: { ...options.scene, html: wrapThalesProof(options.scene.html) } };
      }
      if (!isConverseTheoremSlideshow()) return renderBaseStepCorrection(options);
      let correction = exerciseContent.querySelector(".thales-slideshow-correction");
      if (!correction) {
        // Garder l'énoncé déjà composé pour éviter toute variation de hauteur.
        exerciseContent.querySelector("#exercise-figure")?.remove();
        correction = document.createElement("div");
        correction.className = "thales-slideshow-correction";
        exerciseContent.appendChild(correction);
      }
      return renderBaseStepCorrection({ ...options, container: correction });
    }

    function drawCurrentThalesArrow(
      scene
    ) {
      if (
        exerciseConfig.family !==
          "thales" ||
        scene?.id !==
          "correspondenceArrow"
      ) {
        return;
      }

      drawThalesCorrespondenceArrow(exerciseContent);
    }
    function startStepCorrection() {
      waitingForCorrection =
        false;

      hideCorrectionOverlay();

      hideTimer();

      if (exerciseConfig.family === "trigonometry") {
        const presentation = exerciseConfig.type === "pythagoras-angle"
          ? createPythagorasTrigonometryCorrectionPresentation(currentExercise)
          : exerciseConfig.type === "angle"
          ? createTrigonometryAngleCorrectionPresentation(currentExercise, { mathjax: true })
          : createTrigonometryCorrectionPresentation(currentExercise);
        correctionSteps = presentation.scenes;
        trigonometryCompleteScene = presentation.completeScene;
      } else if (
        exerciseConfig.family ===
        "thales"
      ) {
        correctionSteps =
          createThalesCorrectionScenes(
            currentExercise
          );
      } else if (
        exerciseConfig.family ===
        "thalesConverse"
      ) {
        correctionSteps =
          (exerciseConfig.type === "converse-theorem" ? createThalesConverseTheoremCorrectionScenes : createThalesParallelismCorrectionScenes)(currentExercise);
      } else if (
        exerciseConfig.family ===
        "pythagorasConverse"
      ) {
        correctionSteps =
          createPythagorasConverseCorrectionScenes(
              currentExercise, { mathjax: true }
          );
      } else {
        correctionSteps =
          createPythagorasCorrectionScenes(
            currentExercise
          );
      }

      stepCorrection =
        createStepCorrection({
          stepCount:
            correctionSteps.length
        });

      stepCorrection.start();

      const currentStepIndex =
        stepCorrection
          .getCurrentStepIndex();

      const activeCorrection = stepCorrection;
      renderStepCorrection({
        onReady: () => {
          if (stepCorrection === activeCorrection && activeCorrection.getIsActive()) {
            drawCurrentThalesArrow(correctionSteps[currentStepIndex]);
          }
        },
        container:
          exerciseContent,

        scene:
          correctionSteps[
            currentStepIndex
          ],

        renderFigure:
          renderExerciseFigure
      });

    }

    function advanceStepCorrection() {
      if (
        !stepCorrection ||
        !stepCorrection.getIsActive()
      ) {
        return;
      }

      if (
        stepCorrection.getIsLastStep()
      ) {
        restartButton.style.display =
          "inline-block";

        exportExerciseButton.style.display =
          "inline-block";

        timeSlider.disabled =
          false;

        return;
      }

      stepCorrection.next();

      const currentStepIndex =
        stepCorrection
          .getCurrentStepIndex();

      const activeCorrection = stepCorrection;
      renderStepCorrection({
        onReady: () => {
          if (stepCorrection === activeCorrection && activeCorrection.getIsActive()) {
            drawCurrentThalesArrow(correctionSteps[currentStepIndex]);
          }
        },
        container:
          exerciseContent,

        scene:
          correctionSteps[
            currentStepIndex
          ],

        renderFigure:
          renderExerciseFigure
      });

    }

    function showCompleteStepCorrection() {
      // showAll déplace le curseur à la dernière étape. Lire la phase avant ce saut.
      const currentIndex = stepCorrection?.getCurrentStepIndex();
      const phase = correctionSteps[currentIndex]?.figure?.phase;
      const theoremStart = exerciseConfig.type === "converse-theorem"
        ? correctionSteps.findIndex(scene => scene.id === "theoremFigure") : -1;
      const phaseEnd = currentIndex < theoremStart ? theoremStart - 1 : undefined;
      if (!stepCorrection?.showAll(phaseEnd)) return;
      const showAngleOnly =
        exerciseConfig.type === "pythagoras-angle" && (phase === "proved" || phase === "trigonometry");
      renderStepCorrection({
        container: exerciseContent,
        scene: showAngleOnly || exerciseConfig.type === "converse-theorem"
          ? correctionSteps[stepCorrection.getCurrentStepIndex()]
          : exerciseConfig.family === "trigonometry"
            ? trigonometryCompleteScene
            : createCompleteCorrectionScene(correctionSteps, { cumulative: true }),
        renderFigure: renderExerciseFigure
      });
      if (exerciseConfig.family === "trigonometry") {
        restartButton.style.display = "inline-block";
        exportExerciseButton.style.display = "inline-block";
        timeSlider.disabled = false;
      }
    }

    function previousStepCorrection() {
      if (
        !stepCorrection ||
        !stepCorrection.getIsActive()
      ) {
        return;
      }

      restartButton.style.display =
        "none";

      timeSlider.disabled =
        true;

      stepCorrection.previous();

      const currentStepIndex =
        stepCorrection
          .getCurrentStepIndex();

      const activeCorrection = stepCorrection;
      renderStepCorrection({
        onReady: () => {
          if (stepCorrection === activeCorrection && activeCorrection.getIsActive()) {
            drawCurrentThalesArrow(correctionSteps[currentStepIndex]);
          }
        },
        container:
          exerciseContent,

        scene:
          correctionSteps[
            currentStepIndex
          ],

        renderFigure:
          renderExerciseFigure
      });

    }

    function getCorrectionFactory() {
      switch (
        exerciseConfig.family
      ) {
        case "trigonometry":
          if (exerciseConfig.type === "pythagoras-angle") return exercise => createPythagorasTrigonometryExportCorrectionScenes(exercise, { mode: presentationMode });
          if (exerciseConfig.type === "angle") {
            return exercise => createTrigonometryAngleExportCorrectionScenes(exercise, { mode: presentationMode });
          }
          return presentationMode === "response"
            ? exercise => [createTrigonometryResponseCorrectionScene(exercise)]
            : createTrigonometryExportCorrectionScenes;

        case "pythagoras":
          return (
            createPythagorasCorrectionScenes
          );

        case "pythagorasConverse":
          return exercise => createPythagorasConverseCorrectionScenes(exercise, { mathjax: true });

        case "thales":
          return exercise => {
            const scene = createCompleteCorrectionScene(createThalesCorrectionScenes(exercise), { cumulative: true });
            if (exercise.requiresParallelProof) {
              scene.html = `<div class="thales-perpendicular-correction">${scene.html}</div>`;
            }
            return [scene];
          };

        case "thalesConverse":
          if (exerciseConfig.type === "converse-theorem") return exercise => createThalesConverseTheoremCorrectionScenes(exercise, { mode: presentationMode, forExport: true });
          return (
            createThalesParallelismCorrectionScenes
          );

        default:
          return null;
      }
    }

    exportExerciseButton.addEventListener(
      "click",
      function() {
        if (
          !currentExercise
        ) {
          return;
        }

        let exportStageSelect = null;
        openExportDialog({
          showArchive:
            false,

          onExport({
            exportType,
            includeCorrection
          }) {
            if (
              exportType !==
              "evaluation"
            ) {
              return;
            }

            exportGeneratedExercise({
              singlePageStudentSheet: true,
              title:
                exerciseConfig.title,

              exercise: exerciseConfig.type === "converse-theorem"
                ? { ...currentExercise, statement: createThalesConverseTheoremSlideshowStatement(currentExercise, includeCorrection ? {} : {
                    maxWidth: 620,
                    measure(text) {
                      const context = document.createElement('canvas').getContext('2d');
                      context.font = '18.08px "Times New Roman"';
                      return context.measureText(text).width * 1.08;
                    }
                  }) }
                : currentExercise,

              renderFigure(
                figureOptions
              ) {
                return renderExerciseFigure(
                  figureOptions
                );
              },

              createCorrection:
                exportStageSelect && exportStageSelect.value !== ""
                  ? exercise => exerciseConfig.type === "pythagoras-angle"
                    ? createPythagorasTrigonometryExportCorrectionScenes(exercise, { stageIndex: Number(exportStageSelect.value) })
                    : createTrigonometryAngleExportCorrectionScenes(exercise, { stageIndex: Number(exportStageSelect.value) })
                  : getCorrectionFactory(),

              includeCorrection
            });
          }
        });

        if (exerciseConfig.family === "trigonometry" && ["angle", "pythagoras-angle"].includes(exerciseConfig.type) && presentationMode === "slideshow") {
          const options = document.querySelector(".export-dialog-overlay .export-evaluation-options");
          const label = document.createElement("label");
          label.textContent = "Correction à exporter : ";
          label.style.display = "none";
          exportStageSelect = document.createElement("select");
          exportStageSelect.id = "trigonometry-export-stage";
          const complete = document.createElement("option");
          complete.value = "";
          complete.textContent = "Correction complète";
          exportStageSelect.appendChild(complete);
          const exportScenes = exerciseConfig.type === "pythagoras-angle"
            ? createPythagorasTrigonometryCorrectionPresentation(currentExercise).scenes
            : createTrigonometryAngleCorrectionPresentation(currentExercise, { mathjax: true }).scenes;
          exportScenes.forEach((scene, index) => {
            const option = document.createElement("option");
            option.value = String(index);
            option.textContent = `Étape ${index + 1} sur ${exportScenes.length}`;
            exportStageSelect.appendChild(option);
          });
          label.appendChild(exportStageSelect);
          options.appendChild(label);
          options.addEventListener("change", () => {
            label.style.display = options.querySelector('input[name="evaluation-mode"]:checked')?.value === "correction" ? "block" : "none";
          });
        }
      }
    );

    startButton.addEventListener(
      "click",
      function() {
        setModeButtonsDisabled(
          true
        );

        timeSlider.disabled =
          true;

        pauseButton.textContent =
          "Pause";

        currentExercise =
          generateCurrentExercise();

        displayExercise(
          currentExercise
        );

        showTimer();

        resetTimer(
          selectedTime,
          handleTimeUp
        );

        startButton.style.display =
          "none";
      }
    );

    restartButton.addEventListener(
      "click",
      function() {
        stepCorrection?.stop();
        stepCorrection = null;
        waitingForCorrection = false;
        if (exerciseConfig.family === "trigonometry") {
          trigonometryCompleteScene = null;
        }

        setModeButtonsDisabled(
          true
        );

        timeSlider.disabled =
          true;

        pauseButton.textContent =
          "Pause";

        currentExercise =
          generateCurrentExercise();

        displayExercise(
          currentExercise
        );

        restartButton.style.display =
          "none";

        exportExerciseButton.style.display =
          "none";

        showTimer();

        resetTimer(
          selectedTime,
          handleTimeUp
        );
      }
    );

    pauseButton.addEventListener(
      "click",
      function() {
        if (
          presentationMode !==
          "slideshow"
        ) {
          return;
        }

        if (getIsPaused()) {
          resumeTimer();

          pauseButton.textContent =
            "Pause";
        } else {
          pauseTimer();

          pauseButton.textContent =
            "Reprendre";
        }
      }
    );

    initializeKeyboardShortcuts({
      isWaitingForCorrection() {
        return waitingForCorrection;
      },

      isInCorrectionMode() {
        return (
          stepCorrection !== null &&
          stepCorrection.getIsActive()
        );
      },

      isAwaitingNextQuestion() {
        return false;
      },

      getPresentationMode() {
        return presentationMode;
      },

      getCorrectionStep() {
        return null;
      },

      onStartCorrections:
        startStepCorrection,

      onAdvanceCorrection:
        advanceStepCorrection,

      onShowCompleteCorrection:
        showCompleteStepCorrection,

      onSkipSlideshowQuestion() {
        if (!currentExercise) return;
        stopTimer();
        handleTimeUp();
      },

      onPreviousCorrection:
        previousStepCorrection,

      onNextQuestion() {
      },

      clearAwaitingNextQuestion() {
      }
    });
  </script>
</body>
</html>
