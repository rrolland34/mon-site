<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Choix d'un exercice
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body class="catalog-page">
  <nav class="navbar">
    <ul class="nav-list">
      <li class="nav-item">
        <a
          href="index.html"
          class="nav-link"
        >
          Accueil
        </a>
      </li>

      <li class="nav-item">
        <a
          href="automatismes_6.html"
          class="nav-link"
        >
          Automatismes 6e
        </a>
      </li>

      <li class="nav-item">
        <a
          href="automatismes_3.html"
          class="nav-link"
        >
          Automatismes 3e
        </a>
      </li>

      <li class="nav-item">
        <a
          href="automatismes_dnb.html"
          class="nav-link"
        >
          Automatismes DNB
        </a>
      </li>

      <li class="nav-item">
        <a
          href="exercise_selection.html"
          class="nav-link active"
        >
          Exercices
        </a>
      </li>

      <li class="nav-item">
        <a
          href="outils.html"
          class="nav-link"
        >
          Outils
        </a>
      </li>

      <li class="nav-item">
        <a
          href="videos.html"
          class="nav-link"
        >
          Vidéos
        </a>
      </li>
    </ul>
  </nav>

  <!-- Contenu principal -->
  <main id="exercise-buttons" class="container catalog-layout">
    <section class="buttons-section catalog-card" aria-labelledby="pythagore-title">
      <h2 id="pythagore-title" class="domain-header">Pythagore</h2>
      <div id="pythagore-buttons" class="button-row series-grid"></div>
    </section>
    <section class="buttons-section catalog-card" aria-labelledby="thales-title">
      <h2 id="thales-title" class="domain-header">Thalès</h2>
      <div id="thales-buttons" class="button-row series-grid"></div>
    </section>
    <section class="buttons-section catalog-card" aria-labelledby="trigonometrie-title">
      <h2 id="trigonometrie-title" class="domain-header">Trigonométrie</h2>
      <div id="trigonometrie-buttons" class="button-row series-grid"></div>
    </section>
  </main>

  <script type="module">
    import {
      exerciseConfigs
    } from "./core/exerciseRegistry.js";

    const exerciseButtons =
      document.getElementById(
        "exercise-buttons"
      );

    Object.entries(
      exerciseConfigs
    ).forEach(
      ([exerciseId, config]) => {

        const link =
          document.createElement(
            "a"
          );

        link.href =
          `exercise_player.html?exercise=${exerciseId}`;

        const button =
          document.createElement(
            "button"
          );

        button.type =
          "button";

        button.className =
          "category-btn";

        button.textContent =
          config.title;

        link.appendChild(
          button
        );

        // Répartition visuelle uniquement : titres et destinations restent issus du registre.
        const groupId = config.family === "trigonometry" ? "trigonometrie-buttons"
          : ["pythagoras", "pythagorasConverse"].includes(config.family) ? "pythagore-buttons"
          : ["thales", "thalesConverse"].includes(config.family) ? "thales-buttons" : null;
        (document.getElementById(groupId) ?? exerciseButtons).appendChild(link);
      }
    );
  </script>

</body>
</html>
